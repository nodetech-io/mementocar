name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-37"

      # Also validates the Gradle wrapper JAR. The basic provider keeps caching on actions/cache (MIT)
      # instead of the proprietary enhanced cache.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest testReleaseUnitTest lintRelease

      - name: Script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
